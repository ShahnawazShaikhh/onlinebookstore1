trigger:
  - main

pool:
  name: OpenShiftSA

steps:
  - checkout: self

  - script: |
      echo "Checking Java version"
      java -version
      echo "Checking Maven version"
      mvn -version
    displayName: 'Verify Java and Maven'

  - script: |
      mvn clean package
    displayName: 'Build Java application'

  - task: Docker@2
    displayName: 'Build and Push Image to Quay'
    inputs:
      command: buildAndPush
      containerRegistry: 'QuaySC'
      repository: 'afiyamulla/my-first-app'
      Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
      buildContext: '$(Build.SourcesDirectory)'
      tags: |
        $(Build.BuildId)

  - task: SSH@0
    displayName: 'Deploy Application and Expose Route'
    inputs:
      sshEndpoint: 'OpenShifSC'
      runOptions: 'commands'
      commands: |
        set -e

        echo "Selecting OpenShift project"
        oc project onlinebookstore

        echo "Creating or updating Deployment with current Build ID"
        oc create deployment my-first-app \
          --image=quay.io/afiyamulla/my-first-app:$(Build.BuildId) \
          --dry-run=client -o yaml | oc apply -f -

        echo "Waiting for Deployment rollout"
        oc rollout status deployment/my-first-app \
          -n onlinebookstore --timeout=180s

        echo "Creating Service if it does not exist"
        oc get service my-first-app -n onlinebookstore >/dev/null 2>&1 || \
          oc expose deployment my-first-app \
            --name=my-first-app \
            --port=8080 \
            --target-port=8080 \
            -n onlinebookstore

        echo "Creating Route if it does not exist"
        oc get route my-first-app -n onlinebookstore >/dev/null 2>&1 || \
          oc expose service my-first-app \
            --name=my-first-app \
            -n onlinebookstore

        echo "Verifying Deployment"
        oc get deployment my-first-app -n onlinebookstore

        echo "Verifying Service"
        oc get service my-first-app -n onlinebookstore

        echo "Application Route"
        oc get route my-first-app -n onlinebookstore

        echo "Deployed image"
        oc get deployment my-first-app -n onlinebookstore \
          -o jsonpath='{.spec.template.spec.containers[*].image}{"\n"}'
      readyTimeout: '20000'