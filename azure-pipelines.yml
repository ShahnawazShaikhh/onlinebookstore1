trigger:
  - main

pool:
  name: OpenShiftSA

steps:
  - checkout: self

  - script: |
      echo "Checking Java version"
      java -version
      echo "Checking Maven version"
      mvn -version
    displayName: 'Verify Java and Maven'

  - script: |
      mvn clean package
    displayName: 'Build Java application'

  - task: Docker@2
    displayName: 'Build and Push Image to Quay'
    inputs:
      command: buildAndPush
      containerRegistry: 'QuaySC'
      repository: 'afiyamulla/my-first-app'
      Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
      buildContext: '$(Build.SourcesDirectory)'
      tags: |
        $(Build.BuildId)

  - task: SSH@0
    inputs:
      sshEndpoint: 'OpenShifSC'
      runOptions: 'commands'
      commands: |
        oc whoami
        oc get pods -n onlinebookstore -o wide
        oc get deployment my-first-app -n onlinebookstore
        oc describe deployment my-first-app -n onlinebookstore


        oc project onlinebookstore
        oc set image deployment/my-first-app my-first-app=quay.io/afiyamulla/my-first-app:$(Build.BuildId) -n onlinebookstore
        oc rollout status deployment/my-first-app -n onlinebookstore --timeout=180s
        oc get deployment my-first-app -n onlinebookstore
        
      readyTimeout: '20000'

