trigger:
  - main

pool:
  name: OpenShiftSA

variables:
  IMAGE_NAME: quay.io/afiyamulla/my-first-app
  NAMESPACE: onlinebookstore
  APP_NAME: my-first-app
  CONTAINER_PORT: 8080

steps:
  - checkout: self

  - script: |
      echo "=== Java version ==="
      java -version
      echo "=== Maven version ==="
      mvn -version
    displayName: 'Verify Java and Maven'

  - script: |
      echo "Building application..."
      mvn clean package -DskipTests
    displayName: 'Build Java application (Maven)'

  - task: Docker@2
    displayName: 'Build and Push Image to Quay'
    inputs:
      command: buildAndPush
      containerRegistry: 'QuaySC'
      repository: 'afiyamulla/my-first-app'
      Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
      buildContext: '$(Build.SourcesDirectory)'
      tags: |
        $(Build.BuildId)
        latest

  - task: SSH@0
    displayName: 'Deploy to OpenShift + Expose Route'
    inputs:
      sshEndpoint: 'OpenShifSC'
      runOptions: 'commands'
      readyTimeout: '20000'
      commands: |
        set -euo pipefail

        echo "=== Selecting project ==="
        oc project $(NAMESPACE)

        echo "=== Creating / updating Deployment ==="
        oc create deployment $(APP_NAME) --image=$(IMAGE_NAME):$(Build.BuildId) --dry-run=client -o yaml | oc apply -f -

        echo "=== Setting resource limits (optional) ==="
        oc set resources deployment/$(APP_NAME) --limits=cpu=500m,memory=512Mi --requests=cpu=100m,memory=128Mi -n $(NAMESPACE) || true

        echo "=== Waiting for rollout ==="
        oc rollout status deployment/$(APP_NAME) -n $(NAMESPACE) --timeout=180s

        echo "=== Ensuring Service exists (idempotent) ==="
        oc expose deployment $(APP_NAME) --name=$(APP_NAME) --port=$(CONTAINER_PORT) --target-port=$(CONTAINER_PORT) -n $(NAMESPACE) --dry-run=client -o yaml | oc apply -f -

        echo "=== Ensuring Route exists (idempotent) ==="
        oc expose service $(APP_NAME) --name=$(APP_NAME) -n $(NAMESPACE) --dry-run=client -o yaml | oc apply -f -

        echo "=== Final status ==="
        oc get deployment,svc,route -n $(NAMESPACE)

        echo "=== Currently deployed image ==="
        oc get deployment $(APP_NAME) -n $(NAMESPACE) -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

        echo "=== Route URL ==="
        oc get route $(APP_NAME) -n $(NAMESPACE) -o jsonpath='{.spec.host}{"\n"}' || echo "No route found"